# scores.gametronyx.com — the Gametronyx leaderboard server (gametronyx repo, server/).
#
# Installed by server/deploy/scores-go-live.sh once DNS `A scores.gametronyx.com → the box` resolves.
# certbot then adds the 443 block and the HTTP→HTTPS redirect ("managed by Certbot"), after which re-runs
# leave this file alone.

# Per-IP smoothing in front of the app's own per-player limit. Over the limit answers 429, which game clients
# treat as "try again later".
limit_req_zone $binary_remote_addr zone=gtx_scores:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name scores.gametronyx.com;

    location /api/leaderboards/ {
        limit_req zone=gtx_scores burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        client_max_body_size 32k;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        return 404;
    }
}
