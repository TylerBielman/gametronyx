name: Check the live servers

# When the site says "Can't reach the Gametronyx server", the browser's request never got an
# answer: DNS, the certificate, the server or CORS. This checks each from outside, the way a
# player's browser sees it, and says which one is broken. Run it from the Actions tab.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-health.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          dig +short NS gametronyx.com
          for host in gametronyx.com www.gametronyx.com api.gametronyx.com scores.gametronyx.com noeasywayup.com; do
            for resolver in 1.1.1.1 8.8.8.8; do
              echo "$host @$resolver: $(dig +short A "$host" @"$resolver" | tr '\n' ' ')"
            done
          done
          [ -n "$(dig +short A api.gametronyx.com @1.1.1.1)" ] \
            || { echo "::error::api.gametronyx.com has no DNS record, so no browser can reach the API"; exit 1; }
      - name: Certificates
        if: ${{ !cancelled() }}
        run: |
          for host in api.gametronyx.com scores.gametronyx.com noeasywayup.com; do
            echo "== $host"
            echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject -ext subjectAltName -enddate || echo "no certificate"
          done
      - name: HTTP
        if: ${{ !cancelled() }}
        run: |
          # A 500 from the API carries no CORS headers, so the browser hides it and the site shows
          # "Can't reach the Gametronyx server" even though the server answered.
          probe() {
            echo "== $*"
            curl -sS -m 20 -D - -o body.txt -H 'Origin: https://gametronyx.com' "$@" 2>&1 \
              | grep -iE '^(HTTP/|content-type|access-control-allow-origin)' || true
            head -c 400 body.txt 2>/dev/null; echo
          }
          probe https://api.gametronyx.com/api/games
          probe https://noeasywayup.com/api/games
          probe https://api.gametronyx.com/api/auth/me
          # A made-up player: the right answer is 401, never 500.
          probe https://api.gametronyx.com/api/auth/login -d 'username=gtx-health-check&password=not-a-real-password'
          probe https://noeasywayup.com/api/auth/login -d 'username=gtx-health-check&password=not-a-real-password'
          probe https://scores.gametronyx.com/api/leaderboards/health
          probe https://gametronyx.com/ -o /dev/null
      - name: CORS (the login request from gametronyx.com)
        if: ${{ !cancelled() }}
        run: |
          curl -sS -m 20 -o /dev/null -D - -X OPTIONS https://api.gametronyx.com/api/auth/login \
            -H 'Origin: https://gametronyx.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' | tee headers.txt
          grep -qi '^access-control-allow-origin: https://gametronyx.com' headers.txt \
            || { echo "::error::api.gametronyx.com doesn't allow https://gametronyx.com (CORS)"; exit 1; }
