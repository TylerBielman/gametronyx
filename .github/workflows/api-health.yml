name: Check the live servers

# When the site says "Can't reach the Gametronyx server", the browser's request got no answer it
# could read: DNS, the certificate, CORS, or the API erroring. A 500 from the accounts API carries
# no CORS headers, so the browser hides it and the site blames the player's connection. This checks
# each from outside and goes red on the broken one. Run it from the Actions tab (DECISIONS A62).

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-health.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          echo "nameservers: $(dig +short NS gametronyx.com | tr '\n' ' ')"
          for host in gametronyx.com api.gametronyx.com scores.gametronyx.com; do
            echo "$host: $(dig +short A "$host" @1.1.1.1 | tr '\n' ' ')"
          done
          [ -n "$(dig +short A api.gametronyx.com @1.1.1.1)" ] \
            || { echo "::error::api.gametronyx.com has no DNS record"; exit 1; }
      - name: Certificates
        if: ${{ !cancelled() }}
        run: |
          for host in api.gametronyx.com scores.gametronyx.com; do
            echo | timeout 20 openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null \
              | openssl x509 -noout -subject -enddate -checkend 0 \
              || { echo "::error::$host has no valid certificate"; exit 1; }
          done
      - name: Accounts API
        if: ${{ !cancelled() }}
        run: |
          fail=0
          probe() {  # probe <expected status> <curl args…>
            want=$1; shift
            got=$(curl -sS -m 20 -o body.txt -w '%{http_code}' -H 'Origin: https://gametronyx.com' "$@" || true)
            echo "$got (want $want) $*: $(head -c 200 body.txt 2>/dev/null)"
            [ "$got" = "$want" ] || { echo "::error::$* answered $got, not $want"; fail=1; }
          }
          probe 200 https://api.gametronyx.com/api/health
          # These two read the player database; a 500 here is the API failing to reach Postgres.
          probe 200 https://api.gametronyx.com/api/games
          probe 401 https://api.gametronyx.com/api/auth/login -d 'username=gtx-health-check&password=not-a-real-password'
          preflight=$(curl -sS -m 20 -o /dev/null -D - -X OPTIONS https://api.gametronyx.com/api/auth/login \
            -H 'Origin: https://gametronyx.com' -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true)
          echo "$preflight" | grep -qi '^access-control-allow-origin: https://gametronyx.com' \
            || { echo "::error::api.gametronyx.com doesn't allow https://gametronyx.com (CORS)"; fail=1; }
          exit $fail
      - name: Leaderboard server
        if: ${{ !cancelled() }}
        run: |
          got=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://scores.gametronyx.com/api/leaderboards/health || true)
          echo "scores.gametronyx.com health: $got"
          [ "$got" = 200 ] || { echo "::error::scores.gametronyx.com health answered $got"; exit 1; }
