name: Build and deploy site

# Every push and PR: typecheck, test, build (the site, and the leaderboard server in server/).
# Pushes to main also deploy to GitHub Pages once Pages is switched on:
#   1. Make the repo public (free plan) — DESIGN §12.
#   2. Settings → Pages → Source: "GitHub Actions"; custom domain gametronyx.com.
#   3. Settings → Secrets and variables → Actions → Variables: PAGES_ENABLED = true.
# Until then the deploy job is skipped, so CI stays green.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only when Pages is on: an unused artifact still counts against the
      # account's shared Actions storage quota (private repos, free plan).
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: dist
          retention-days: 1

  # The leaderboard server (server/) is its own package; it deploys to the box by hand (server/deploy/).
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
