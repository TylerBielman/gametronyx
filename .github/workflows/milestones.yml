name: Sync milestones

# Milestones are code: .github/milestones.json lists each milestone's title and
# description. Merging a change to it creates new milestones and updates the
# descriptions of existing ones (matched by title). Nothing is ever deleted or
# closed here; close a finished milestone on GitHub.

on:
  push:
    branches: [main]
    paths: ['.github/milestones.json']
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/milestones.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              ...context.repo, state: 'all', per_page: 100,
            });
            for (const m of wanted) {
              const found = existing.find((e) => e.title === m.title);
              if (!found) {
                const { data } = await github.rest.issues.createMilestone({
                  ...context.repo, title: m.title, description: m.description,
                });
                core.info(`Created #${data.number} ${m.title}`);
              } else if (found.description !== m.description) {
                await github.rest.issues.updateMilestone({
                  ...context.repo, milestone_number: found.number, description: m.description,
                });
                core.info(`Updated #${found.number} ${m.title}`);
              } else {
                core.info(`Unchanged #${found.number} ${m.title}`);
              }
            }
